# =============================================================================
# Kiwis Research - Default Configuration
# =============================================================================

project_name: "kiwis-research"

# ---- Pipeline settings ----
pipeline:
  max_iterations: 3                        # Max research iterations
  hypothesis_generation_rounds: 3          # How many hypothesis rounds per iteration
  literature_review_papers_max: 20         # Max papers to retrieve
  peer_review_critique_rounds: 2           # Review iterations before submitting
  auto_submit_threshold: null              # Auto-submit if reviewer score >= this (0-1)

# ---- Agent settings ----
agents:
  ideation:
    model: "gpt-4o"
    temperature: 0.7                       # Higher = more creative hypotheses
    enabled: true
  
  librarian:
    model: "gpt-4o"
    temperature: 0.2                       # Lower = more factual citations
    enabled: true
  
  experiment_architect:
    model: "gpt-4o"
    temperature: 0.4
    enabled: true
  
  engineer:
    model: "gpt-4o"                        # Code generation needs low temp
    temperature: 0.2
    max_tokens: 16384
    enabled: true
  
  data_analyst:
    model: "gpt-4o"
    temperature: 0.3
    enabled: true
  
  writer:
    model: "gpt-4o"                        # Writing needs creativity
    temperature: 0.4
    max_tokens: 16384
    enabled: true
  
  reviewer:
    model: "claude-3-5-sonnet-20241022"   # Claude excels at critical analysis
    temperature: 0.1                       # Lowest for rigorous review
    enabled: true

# ---- LLM providers ----
providers:
  openai:
    provider_type: "openai"
    default_model: "gpt-4o"
    supported_models:
      - "gpt-4o"
      - "gpt-4o-mini"
      - "gpt-4-turbo"
  
  anthropic:
    provider_type: "anthropic"
    default_model: "claude-3-5-sonnet-20241022"
    supported_models:
      - "claude-3-5-sonnet-20241022"
      - "claude-3-opus-20240229"

# ---- Sandbox settings ----
sandbox:
  mode: "isolated"                         # docker | isolated (no Docker required)
  timeout_seconds: 600
  memory_mb: 4096
  network_isolated: true
  gpu_available: false

# ---- Storage ----
paths:
  output: "output/"
  data: "data/"
  experiments: "data/experiments/"
  artifacts: "output/artifacts/"
  papers_dir: "output/papers/"

# ---- Memory/Vector Store ----
memory:
  vector_store: "chroma"                   # chroma | qdrant | pgvector
  persist_dir: "./chroma_kiwis/"

# ---- Logging ----
logging:
  level: "INFO"                            # DEBUG | INFO | WARNING | ERROR
  format: "%(asctime)s | %(name)-20s | %(levelname)-8s | %(message)s"

# =============================================================================
# Ollama Local Model Options
# =============================================================================
ollama:
  enabled: false                        # Set to true to enable local models
  base_url: "http://localhost:11434"   # Your Ollama endpoint
  default_model: "llama3.2"             # Will pull from registry if not present
  
  # Recommended models by capability tier:
  model_tiers:
    lightweight:                         # < 5GB RAM, CPU only
      - "phi3-mini"                     # 3.8B params
      - "gemma2:2b"                    # 2.6B params
    balanced:                            # 8-12GB RAM, decent quality
      - "llama3.2"                     # 8B params — best all-rounder local
      - "mistral-nemo"                # 12B params — strong reasoning
      - "qwen2.5-coder:7b"            # 7B params — code specialist
    powerful:                            # 32GB+ RAM, GPU preferred
      - "llama3.3"                     # 70B params — top local quality
      - "deepseek-r1"                  # Strong reasoning capability

# Suggested model assignments for cost-conscious setups:
#
# For full local setup (no API costs):
#   engine:    llama3.2          (code generation)
#   analyst:   mistral-nemo     (statistical reasoning)
#   reviewer:  deepseek-r1      (critical analysis - needs more RAM)
#
# For hybrid setup (some cloud, some local):
#   writer:    gpt-4o           (long-form writing quality)
#   reviewer:  claude-3.5-s     (adversarial critique quality)
#   engineer:  llama3.2         (code gen — runs locally!)
#   librarian: ollama/llama3.3 (literature synthesis)
