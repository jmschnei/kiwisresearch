[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwis-research"
version = "0.1.0"
description = "Multi-Agent Scientific Research Automation System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kiwis Team", email = "kiwis@dfki.de"},
]

dependencies = [
    # Core orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    
    # LLM providers
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "dashscope>=1.14.0",
    
    # Data & Memory
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "chromadb>=0.4.0",
    "qdrant-client>=1.7.0",
    
    # HTTP & APIs
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    
    # Document processing
    "pypdf>=4.0.0",
    "urllib3>=2.0.0",
    
    # Sandbox & execution
    "docker>=7.0.0",
    "jupyter-client>=8.6.0",
    "nbformat>=5.10.0",
    "nbconvert>=7.16.0",
    
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.19.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    
    # PDF/LaTeX
    "latexcodec>=3.0.0",
    "jinja2>=3.1.0",
    "weasyprint>=61.0",
    
    # Utilities
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "tenacity>=8.4.0",
    "loguru>=0.7.0",
    "typer>=0.9.0",
    
    # Testing
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx-mock>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
sandbox-docker = ["docker>=7.0.0"]
sandbox-sqlite = ["aiosqlite>=0.19.0", "sqlalchemy>=2.0.0"]
viz = ["plotly>=5.19.0", "seaborn>=0.13.0", "matplotlib>=3.8.0"]

[project.scripts]
kiwis = "kiwis.cli:main"
kiwis-init = "kiwis.cli:init_command"
kiwis-research = "kiwis.cli:research_command"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
