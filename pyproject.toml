[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwis-research"
version = "0.1.0"
description = "Multi-Agent Scientific Research Automation System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Kiwis Team", email = "kiwis@dfki.de"},
]

dependencies = [
    # LLM providers (DeepSeek uses the OpenAI SDK; Ollama is called over HTTP)
    "openai>=1.55.0",
    "anthropic>=2.0.0",

    # Literature memory (vector stores) and the experiments database
    "chromadb>=0.4.0",
    "qdrant-client>=1.7.0",
    "aiosqlite>=0.19.0",

    # HTTP (arXiv / Semantic Scholar / Ollama)
    "httpx>=0.27.0",

    # Figures for the paper
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",

    # Configuration
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
pgvector = ["asyncpg>=0.29.0"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.29.0"]
# Libraries the generated experiment code may import when it runs in the `isolated` sandbox (same interpreter
# as Kiwis). The `docker` sandbox has its own image with these packages and does not need this extra.
experiments = ["numpy>=1.26.0", "pandas>=2.2.0", "scipy>=1.12.0", "scikit-learn>=1.4.0",
               "matplotlib>=3.8.0", "seaborn>=0.13.0", "plotly>=5.19.0"]

[project.scripts]
kiwis = "kiwis.cli:main"
kiwis-init = "kiwis.cli:init_command"
kiwis-research = "kiwis.cli:research_command"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
